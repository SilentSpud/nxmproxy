[package]
name = "nxmproxy"
version = "0.2.0"
edition = "2024"

[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'
panic = 'abort'
strip = true

[dependencies]
windows = { version = "0.62", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_System_Registry",
	"Win32_System_Threading",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }
log = "0.4"

[dev-dependencies]
