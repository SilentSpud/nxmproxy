[package]
name = "nxmproxy"
version = "0.2.0"
edition = "2024"

[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'

[dependencies]
windows = { version = "0.62", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_System_Registry",
	"Win32_System_Threading",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }
once_cell = "*"
structopt = "0.3"
url = "2.5"
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"

[dev-dependencies]
